<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>가짜 PLC 모니터</title>
<style>
  body { margin: 0; font-family: "Malgun Gothic", sans-serif; font-size: 13px; background: #f4f5f7; color: #222; }
  header { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 8px 12px;
           background: #263238; color: #fff; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  button { font: inherit; padding: 2px 10px; cursor: pointer; }
  #path { font: inherit; width: 420px; }
  #mode { padding: 2px 10px; border-radius: 4px; font-weight: bold; }
  #mode.run { background: #2e7d32; }
  #mode.stop { background: #c62828; }
  #warn div { padding: 3px 12px; }
  .problem { background: #ffebee; color: #b71c1c; }
  .warning { background: #fff8e1; color: #6d4c00; }
  main { display: flex; gap: 8px; padding: 8px; align-items: flex-start; }
  #ladder { flex: 1; overflow: auto; height: calc(100vh - 140px); background: #fff; border: 1px solid #ccc;
            padding: 4px 0; }
  aside { width: 380px; height: calc(100vh - 140px); overflow: auto; }
  aside h3 { margin: 8px 0 4px; font-size: 14px; }
  .comment { margin: 8px 0 0 48px; color: #2e7d32; }
  .rung { display: grid; grid-template-columns: repeat(32, 38px); grid-auto-rows: 34px; position: relative;
          margin: 2px 0 2px 48px; width: max-content; border-left: 3px solid #455a64;
          border-right: 3px solid #455a64; }
  .no { position: absolute; left: -44px; top: 10px; font-size: 11px; color: #888; }
  .el { position: relative; text-align: center; white-space: nowrap; font-size: 10px; }
  .el .t { position: absolute; left: -2px; right: -2px; top: 1px; overflow: hidden; font-size: 9px; }
  .el .s { position: absolute; left: 0; right: 0; top: 14px; font-size: 13px; line-height: 16px; }
  .h::after { content: ""; position: absolute; left: 0; right: 0; top: 21px; border-top: 2px solid #455a64; }
  .box { border: 1px solid #455a64; background: #fafafa; margin: 6px 2px; font-size: 11px; line-height: 20px;
         overflow: hidden; }
  .bad { border-color: #c62828; color: #c62828; font-weight: bold; }
  .v { border-right: 2px solid #455a64; margin: 21px 0 13px 0; }
  .on .s, .box.on { background: #1e88e5; color: #fff; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  td, th { border: 1px solid #ddd; padding: 1px 6px; text-align: left; }
  td button { padding: 0 6px; }
  #modbus { font-family: Consolas, monospace; font-size: 12px; background: #fff; border: 1px solid #ccc;
            height: 220px; overflow: auto; white-space: pre; padding: 2px 4px; }
</style>
</head>
<body>
<header>
  <h1>가짜 PLC 모니터</h1>
  <span id="mode">-</span>
  <button onclick="post('/api/run', {})">RUN</button>
  <button onclick="post('/api/stop', {})">STOP</button>
  <span id="info"></span>
  <input id="path" type="text" placeholder="파일 경로 (.xgwx, .ld.txt, .bin)">
  <button onclick="post('/api/open', {path: $('path').value, programs: null})">열기</button>
  <span id="programs"></span>
</header>
<div id="warn"></div>
<main>
  <section id="ladder"></section>
  <aside>
    <h3>강제 입력 (배선 입력보다 우선)</h3>
    <div>
      <input id="dev" size="9" placeholder="P00004">
      <button onclick="force($('dev').value, 1)">1</button>
      <button onclick="force($('dev').value, 0)">0</button>
      <button onclick="force($('dev').value, null)">해제</button>
      <span id="forced"></span>
    </div>
    <h3>디바이스</h3>
    <table><thead><tr><th>디바이스</th><th>값</th><th>강제</th></tr></thead><tbody id="devices"></tbody></table>
    <h3>Modbus 기록 (최신이 위)</h3>
    <div id="modbus"></div>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
const SYMBOL = {NO: "┤ ├", NC: "┤/├", P: "┤P├", OUT: "( )", SET: "(S)", RST: "(R)"};
let opened = -1, path = "", lastError = "", shown = new Set(), cells = {};

async function post(url, body) {
  try {
    const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"},
                                body: JSON.stringify(body)});
    lastError = r.ok ? "" : (await r.json()).error;
  } catch (e) {
    lastError = "요청 실패: " + e;
  }
}

function force(device, value) {
  post("/api/force", {device: device.trim().toUpperCase(), value: value});
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function draw(d) {
  // 렁마다 32칸 격자. 파일에서 온 글자는 모두 textContent로 넣는다.
  const root = $("ladder");
  root.textContent = "";
  for (const p of d.programs) {
    if (d.programs.length > 1) root.append(el("h3", "comment", "프로그램 " + p.name));
    for (const r of p.rungs) {
      if (r.comment) root.append(el("div", "comment", "렁 " + r.n + " · " + r.comment));
      if (!r.items.length && !r.vlines.length) continue;
      const g = el("div", "rung");
      g.append(el("span", "no", "렁 " + r.n));
      for (const it of r.items) {
        let e;
        if (it.kind === "H") e = el("div", "el h");
        else if (SYMBOL[it.kind]) {
          e = el("div", "el");
          e.append(el("span", "t", it.text), el("span", "s", SYMBOL[it.kind]));
        } else e = el("div", "el box" + (it.kind === "?" ? " bad" : ""), it.text);
        e.id = "e" + it.id;
        e.title = it.text;
        e.style.gridRow = it.row + 1;
        e.style.gridColumn = (it.col + 1) + " / span " + it.span;
        g.append(e);
      }
      for (const [row, col] of r.vlines) {
        const v = el("div", "v");
        v.style.gridRow = (row + 1) + " / span 2";
        v.style.gridColumn = col + 1;
        g.append(v);
      }
      root.append(g);
    }
  }
  shown = new Set();
}

function programs(s) {
  // 프로그램이 여럿이면 고른다. 기본은 모두 (3.7)
  const box = $("programs");
  box.textContent = "";
  if (s.names.length < 2) return;
  box.append("프로그램: ");
  for (const n of s.names) {
    const c = el("input");
    c.type = "checkbox";
    c.value = n;
    c.checked = s.chosen.includes(n);
    const label = el("label");
    label.append(c, " " + n + " ");
    box.append(label);
  }
  const b = el("button", "", "고른 것만 실행");
  b.onclick = () => post("/api/open", {path: path,
    programs: [...box.querySelectorAll("input:checked")].map(c => c.value)});
  box.append(b);
}

function deviceRows(s) {
  // 표의 줄은 파일을 열 때만 다시 만든다. 값은 묻을 때마다 칸만 바꾼다.
  const tb = $("devices");
  tb.textContent = "";
  cells = {};
  for (const [d] of s.devices) {
    const tr = tb.insertRow();
    tr.insertCell().textContent = d;
    const value = tr.insertCell(), f = tr.insertCell(), mark = el("span");
    f.append(mark);
    if ("PM".includes(d[0])) {
      for (const [label, v] of [["1", 1], ["0", 0], ["해제", null]]) {
        const b = el("button", "", label);
        b.onclick = () => force(d, v);
        f.append(b);
      }
    }
    cells[d] = [value, mark];
  }
}

function update(s) {
  $("mode").textContent = s.running ? "RUN" : "STOP";
  $("mode").className = s.running ? "run" : "stop";
  $("info").textContent = "스캔 " + s.scans + " · 로봇 " + (s.robot ? s.robot + "대 연결됨" : "없음") +
    " · Modbus " + s.ports.modbus + " · 배선 " + s.ports.wiring;
  const warn = $("warn");
  warn.textContent = "";
  if (lastError) warn.append(el("div", "problem", lastError));
  if (s.robot > 1) warn.append(el("div", "warning", "로봇이 " + s.robot + "대 붙었다. 한 대만 붙인다 (가짜 로봇을 두 번 띄웠는지 본다)"));
  if (s.problems.length) warn.append(el("div", "problem", "실행할 수 없음 (RUN 거부)"));
  for (const t of s.problems) warn.append(el("div", "problem", t));
  for (const t of s.warnings) warn.append(el("div", "warning", t));
  for (const [d, v, acc] of s.devices) {
    if (!cells[d]) continue;
    cells[d][0].textContent = acc === null ? v : v + " · " + acc + " ms";
    cells[d][1].textContent = d in s.forced ? "강제 " + s.forced[d] + " " : "";
  }
  $("forced").textContent = Object.entries(s.forced).map(([d, v]) => d + "=" + v).join(", ");
  $("modbus").textContent = s.modbus.map(m => m.at + "  " + m.text).join("\n");
  const now = new Set(s.on);
  for (const id of shown) if (!now.has(id)) $("e" + id)?.classList.remove("on");
  for (const id of now) if (!shown.has(id)) $("e" + id)?.classList.add("on");
  shown = now;
}

async function poll() {
  try {
    const s = await (await fetch("/api/state")).json();
    if (s.opened !== opened) {
      draw(await (await fetch("/api/diagram")).json());
      opened = s.opened;
      path = s.path;
      $("path").value = s.path;
      programs(s);
      deviceRows(s);
    }
    update(s);
  } catch (e) {
    $("mode").textContent = "연결 끊김";
    $("mode").className = "stop";
  }
  setTimeout(poll, 250);
}
poll();
</script>
</body>
</html>
